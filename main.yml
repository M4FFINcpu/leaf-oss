name: Build Leaf OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Build the ISO in a Debian 12 container
        run: |
          DIR=.
          [ -f build.sh ] || DIR=leafos-iso-kit
          docker run --rm --privileged -v "$PWD/$DIR":/build -w /build debian:bookworm bash ./build.sh
          mkdir -p out
          cp "$DIR"/out/leafos-4.5-amd64.iso out/

      - name: Publish the ISO as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: leafos-4.5-build-${{ github.run_number }}
          name: Leaf OS 4.5 ISO (build ${{ github.run_number }})
          body: |
            Bootable Leaf OS 4.5 for VirtualBox, USB sticks and PCs. Download leafos-4.5-amd64.iso below.
            New: Leaf OS 4.5 desktop (Windows 10 style, Chromium with tabs and real websites, EXE Runner, Weather, Alarms & Clock, Sticky Notes),
            a Downloads app, and a fix for the crash when downloading files.
          files: out/leafos-4.5-amd64.iso
          fail_on_unmatched_files: true
